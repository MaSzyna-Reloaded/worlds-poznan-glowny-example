name: release

# <world>.zip - worlds/<world>/ (world.pck, a pack a block) and worlds/<world>.json, unzipped into
# the game directory - built by `make packs` and published on every push to main as the release
# <world>-<run number>, the latest. The world's files are packed as they are by world-packer
# (vendor/world-packer), with no libmaszyna, by the double precision Godot of libmaszyna's release
# (its ci/fetch-godot.sh, from libmaszyna's LIBMASZYNA_REF).
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # the libmaszyna whose engine the packs are written by (its GODOT_VERSION, the game's)
  LIBMASZYNA_REF: feat/world-pck

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: true

      - name: Checkout libmaszyna's engine fetching
        uses: actions/checkout@v6
        with:
          repository: MaSzyna-Reloaded/libmaszyna
          ref: ${{ env.LIBMASZYNA_REF }}
          path: libmaszyna
          sparse-checkout: |
            ci
            Makefile
          sparse-checkout-cone-mode: false

      - name: Fetch the double precision Godot
        run: |
          libmaszyna/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the packs
        id: packs
        run: |
          make packs GODOT=godot-double PACKS_OUT="$PWD/dist"
          echo "world=$(make -s world-name)" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ steps.packs.outputs.world }}-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD: ${{ steps.packs.outputs.world }}
        run: |
          tag="$WORLD-${{ github.run_number }}"
          gh release create "$tag" "dist/$WORLD.zip" --target "$GITHUB_SHA" --title "$tag" --latest \
            --notes "worlds/$WORLD/ and worlds/$WORLD.json of ${GITHUB_SHA::7}: unzip into the game directory."
